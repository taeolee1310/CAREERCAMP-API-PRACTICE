<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빠른 하차 정보</title>
<style>
  :root { --bg:#eaf1fb; --glass:rgba(255,255,255,.62); --edge:rgba(255,255,255,.7);
          --text:#1d1d1f; --sub:#6e6e73; --err:#d70015; --chip:rgba(255,255,255,.55);
          --accent:#2f6fed; --ease:cubic-bezier(.22,1,.36,1); }
  * { box-sizing:border-box; }
  body { margin:0; padding:40px 16px 56px; color:var(--text); min-height:100vh;
         background:var(--bg);
         font:100%/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
         -webkit-font-smoothing:antialiased; }
  body::before { content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
         background:radial-gradient(1200px 600px at 20% -10%,#cfe3ff 0,transparent 60%),
                    radial-gradient(900px 500px at 100% 0,#ffe3d1 0,transparent 55%); }
  main { max-width:720px; margin:0 auto; }
  h1 { font-size:clamp(1.75rem,5vw,2.5rem); line-height:1.1; letter-spacing:-.03em; margin:0 0 .4rem; font-weight:700; }
  .lead { color:var(--sub); font-size:.95rem; margin:0 0 1.5rem; }
  .card { background:var(--glass); border:1px solid var(--edge); border-radius:22px; padding:1.25rem 1.4rem; margin-bottom:1rem;
          -webkit-backdrop-filter:blur(14px) saturate(140%); backdrop-filter:blur(14px) saturate(140%);
          box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 8px 30px rgba(30,50,90,.08); }
  .card h2 { font-size:.8rem; margin:0 0 .9rem; color:var(--sub); font-weight:600; letter-spacing:.04em; }
  .loading { color:var(--sub); animation:pulse 1.4s ease-in-out infinite; }
  .error { color:var(--err); }
  .empty { color:var(--sub); }
  #resultBody > * { animation:rise .45s var(--ease) both; }

  form { display:flex; gap:.6rem; }
  input[type=search] { flex:1; min-width:0; min-height:44px; padding:0 1rem; border-radius:14px; border:1px solid var(--edge);
          background:var(--chip); color:var(--text); font:inherit; }
  input[type=search]:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .go { min-height:44px; min-width:5rem; padding:0 1.2rem; border:0; border-radius:14px; background:#3b6fe0; color:#fff;
        font:inherit; font-weight:600; cursor:pointer; transition:transform .12s ease-out; }
  .go:active, .chip:active { transform:scale(.96); }
  .chips { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.8rem; }
  .chip { min-height:44px; padding:0 1rem; border-radius:999px; border:1px solid var(--edge); background:var(--chip);
          color:var(--text); font:inherit; font-size:.9rem; cursor:pointer; transition:transform .12s ease-out; }
  .chip[aria-pressed=true] { background:#3b6fe0; border-color:#3b6fe0; color:#fff; }

  .sum { display:flex; flex-wrap:wrap; align-items:baseline; gap:.2rem .6rem; margin:0 0 .3rem; }
  .sum b { font-size:1.2rem; letter-spacing:-.02em; }
  .sum span { color:var(--sub); font-size:.85rem; }
  .guide { color:var(--sub); font-size:.8rem; margin:0 0 1.2rem; }
  .chip small { margin-left:.25rem; font-size:.75rem; opacity:.75; }
  .stnbox { margin-bottom:1.6rem; }
  .stnbox:last-of-type { margin-bottom:0; }
  .stn { display:flex; align-items:center; gap:.5rem; margin:0 0 .8rem; font-size:1.1rem; letter-spacing:-.01em; }
  .badge { display:inline-flex; align-items:center; min-height:1.5rem; padding:0 .65rem; border-radius:999px; font-size:.75rem; font-weight:700;
           background:var(--lc,#6e6e73); color:var(--lt,#fff); }
  .group { margin-bottom:1.3rem; }
  .group:last-child { margin-bottom:0; }
  .dir { margin:0 0 .5rem; font-size:.95rem; letter-spacing:-.01em; }
  .dir small { color:var(--sub); font-weight:400; font-size:.8rem; margin-left:.3rem; }
  .strip-cap { display:flex; justify-content:space-between; color:var(--sub); font-size:.7rem; margin:0 0 .25rem; }
  .strip { display:flex; gap:3px; overflow-x:auto; margin:0 0 .8rem; padding-bottom:2px; }
  .car { flex:1 0 1.7rem; min-height:3.4rem; padding:.3rem 0; border-radius:10px; background:var(--chip); text-align:center; font-size:.75rem; color:var(--sub); }
  .car.on { background:rgba(47,111,237,.14); box-shadow:inset 0 0 0 1.5px var(--accent); color:var(--text); font-weight:700; }
  .car i { display:block; font-style:normal; font-size:1rem; line-height:1.3; font-weight:400; }
  .row { display:flex; align-items:center; gap:.9rem; background:var(--chip); border-radius:16px; padding:.7rem .9rem; margin-bottom:.5rem; }
  .door { flex:0 0 5.6rem; text-align:center; }
  .door b { display:block; font-size:1.7rem; line-height:1.1; letter-spacing:-.03em; }
  .door span { font-size:.7rem; color:var(--sub); white-space:nowrap; }
  .info b { font-size:.95rem; }
  .info div { color:var(--sub); font-size:.8rem; }
  .meta { color:var(--sub); font-size:.75rem; margin-top:.8rem; }

  .apibox { background:#10233f; border-color:rgba(255,255,255,.12); color:#dce6f5; -webkit-backdrop-filter:none; backdrop-filter:none; }
  .apibox h2 { color:#9fb6d8; }
  .apibox code { display:block; word-break:break-all; font-size:.75rem; margin:.2rem 0 .3rem; color:#fff; }
  .apibox a { color:#8fb8ff; font-size:.8rem; display:inline-block; transition:transform .12s ease-out; }
  .apibox a:active { transform:scale(.97); }
  .apibox .meta { color:#9fb6d8; }
  footer { color:var(--sub); font-size:.75rem; text-align:center; margin-top:1.5rem; }
  @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes pulse { 50% { opacity:.45; } }
  @keyframes opacity-in { from { opacity:0; } to { opacity:1; } }
  @media (prefers-reduced-motion:reduce) {
    #resultBody > * { animation:opacity-in .2s ease both; }
    .loading { animation:none; }
    .go, .chip, .apibox a { transition:none; }
  }
  @media (prefers-reduced-transparency:reduce) {
    .card { background:#fff; -webkit-backdrop-filter:none; backdrop-filter:none; }
    .apibox { background:#10233f; }
  }
  /* 다크 모드: 토글로 고른 값(data-theme)이 시스템 설정보다 우선 */
  :root[data-theme=dark] { --bg:#0b0f17; --glass:rgba(40,44,54,.62); --edge:rgba(255,255,255,.1); --text:#f5f5f7; --sub:#a1a1a6;
          --chip:rgba(255,255,255,.08); --err:#ff6961; color-scheme:dark; }
  :root[data-theme=dark] body::before { background:radial-gradient(1200px 600px at 20% -10%,#1b2f55 0,transparent 60%),
                    radial-gradient(900px 500px at 100% 0,#3a2418 0,transparent 55%); }
  :root[data-theme=dark] .card { box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 8px 30px rgba(0,0,0,.35); }
  @media (prefers-color-scheme:dark) {
    :root:not([data-theme=light]) { --bg:#0b0f17; --glass:rgba(40,44,54,.62); --edge:rgba(255,255,255,.1); --text:#f5f5f7; --sub:#a1a1a6;
            --chip:rgba(255,255,255,.08); --err:#ff6961; color-scheme:dark; }
    :root:not([data-theme=light]) body::before { background:radial-gradient(1200px 600px at 20% -10%,#1b2f55 0,transparent 60%),
                      radial-gradient(900px 500px at 100% 0,#3a2418 0,transparent 55%); }
    :root:not([data-theme=light]) .card { box-shadow:0 1px 0 rgba(255,255,255,.06) inset, 0 8px 30px rgba(0,0,0,.35); }
  }
  main { position:relative; }
  h1 { padding-right:5rem; }
  /* 스위치 토글: 손잡이가 미끄러지며 해/달 쪽으로 이동 */
  .theme { position:absolute; top:0; right:0; width:3.5rem; height:2rem; padding:0; border:1px solid var(--edge); border-radius:999px;
           background:#cfe0fb; cursor:pointer; transition:background .35s var(--ease), transform .12s ease-out; }
  .theme[aria-checked=true] { background:#2c3a5c; }
  .theme:active { transform:scale(.96); }
  .theme:focus-visible { outline:3px solid #2f6fed; outline-offset:2px; }
  .theme .ico { position:absolute; top:50%; transform:translateY(-50%); font-size:.8rem; line-height:1; opacity:.55; }
  .theme .sun { right:.45rem; } .theme .moon { left:.45rem; }
  .theme .knob { position:absolute; top:.17rem; left:.17rem; width:1.5rem; height:1.5rem; border-radius:50%; background:#fff;
                 box-shadow:0 1px 4px rgba(0,0,0,.3); transition:transform .4s cubic-bezier(.34,1.4,.64,1); }
  .theme[aria-checked=true] .knob { transform:translateX(1.5rem); }
  @media (prefers-reduced-motion:reduce) { .theme, .theme .knob { transition:none; } }
</style>
</head>
<body>
<main>
  <button class="theme" id="theme" type="button" role="switch" aria-checked="false" aria-label="다크 모드"><span class="ico moon" aria-hidden="true">🌙</span><span class="ico sun" aria-hidden="true">☀️</span><span class="knob"></span></button>
  <h1>🚇 빠른 하차 정보</h1>
  <p class="lead">내릴 역을 찾으면 계단·엘리베이터·에스컬레이터와 가장 가까운 칸과 문을 알려 줘요.</p>

  <section class="card">
    <h2>내릴 역</h2>
    <form id="form">
      <input type="search" id="q" placeholder="역 이름 (예: 서울역, 강남)" maxlength="20" autocomplete="off" aria-label="내릴 역 이름">
      <button class="go" type="submit">찾기</button>
    </form>
    <div class="chips" id="quick" aria-label="자주 찾는 역"></div>
  </section>

  <section class="card" id="resultCard" hidden>
    <h2>가까운 칸·문</h2>
    <div class="chips" id="facFilter" style="margin:0 0 1rem" aria-label="이동 설비 고르기"></div>
    <div id="resultBody" class="loading">불러오는 중이에요…</div>
  </section>

  <section class="card apibox">
    <h2>🔌 이 화면이 쓰는 API</h2>
    <b>빠른하차정보 조회</b>
    <code id="apiUrl"></code>
    <a id="apiLink" target="_blank" rel="noopener">새 탭에서 원본 JSON 보기 ↗</a>
    <div class="meta">공공데이터포털 인증키는 서버(.env)에만 있고 이 화면 코드에는 없어요. 서울교통공사 서버 주소: apis.data.go.kr/B553766/inout/getFstExit</div>
  </section>

  <footer>데이터 출처: 서울교통공사 빠른하차정보 (공공데이터포털)</footer>
</main>
<script>
const API = {
  // 🔌 우리 서버가 서울교통공사 빠른하차정보 API를 대신 불러 줘요 (키는 서버에만 있음). 우리 서버(3000번)가 아닌 곳에서 열렸으면(파일·IDE 미리보기·Live Server) 서버 주소를 직접 쓴다
  exit: (location.origin === "http://localhost:3000" || location.origin === "http://127.0.0.1:3000" ? "" : "http://localhost:3000") + "/api/exit",
};
const QUICK = ["서울역", "강남", "잠실", "홍대입구", "신도림"];
const FAC_ICON = { "엘리베이터":"🛗", "에스컬레이터":"↗️", "계단":"🪜" };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

// 실패 이유는 사람이 읽을 수 있게: 영어 오류 문구나 HTTP 번호를 그대로 보여 주지 않는다
const whyFailed = e => /Failed to fetch|NetworkError|Load failed/i.test(e.message) ? " 서버가 켜져 있는지 확인해 주세요. (터미널에서 node server.js)"
  : /^HTTP (\d+)/.test(e.message) ? " (서버 오류 " + e.message.slice(5) + ")" : "";

let items = [], facility = "전체", lastName = "";
const body = document.getElementById("resultBody");

// 호선 색 (밝은 색은 어두운 글자로 맞춰 대비를 지킨다)
const LINE = { "1호선":["#0052A4"], "2호선":["#00A84D","#1d1d1f"], "3호선":["#EF7C1C","#1d1d1f"], "4호선":["#00A5DE","#1d1d1f"],
  "5호선":["#8B50A4"], "6호선":["#CD7C2F","#1d1d1f"], "7호선":["#6B7500"], "8호선":["#D6125F"], "9호선":["#BDB092","#1d1d1f"] };
const lineBadge = n => { const c = LINE[n] || []; return `<span class="badge" style="${c[0] ? `--lc:${c[0]};` : ""}${c[1] ? `--lt:${c[1]}` : ""}">${esc(n)}</span>`; };

function renderFilter() {
  const cnt = {};
  for (const i of items) if (i.plfmCmgFac) cnt[i.plfmCmgFac] = (cnt[i.plfmCmgFac] || 0) + 1;
  const kinds = ["전체", ...Object.keys(cnt)];
  document.getElementById("facFilter").innerHTML = kinds.map(k =>
    `<button type="button" class="chip" aria-pressed="${k === facility}" data-k="${esc(k)}">${FAC_ICON[k] || ""} ${esc(k)}<small>${k === "전체" ? items.length : cnt[k]}</small></button>`).join("");
}

// 열차 칸 지도: 앞쪽 칸부터 칸마다 설비 아이콘을 보여 줘서, 어느 칸에서 내릴지 한눈에 보이게 한다
function strip(rows) {
  const cars = new Map();
  for (const r of rows) {
    const c = parseInt(r.qckgffVhclDoorNo, 10);
    if (!c) continue;
    if (!cars.has(c)) cars.set(c, new Set());
    if (r.plfmCmgFac) cars.get(c).add(r.plfmCmgFac);
  }
  const last = Math.max(0, ...cars.keys());
  if (!last) return "";
  let cells = "";
  for (let c = 1; c <= last; c++) {
    const f = [...(cars.get(c) || [])];
    cells += `<div class="car${f.length ? " on" : ""}" role="listitem" aria-label="${c}번 칸${f.length ? " " + esc(f.join(", ")) : ""}">${c}<i aria-hidden="true">${f.map(k => FAC_ICON[k] || "•").join("") || "·"}</i></div>`;
  }
  return `<div class="strip-cap" aria-hidden="true"><span>◀ 열차 앞</span><span>뒤 ▶</span></div><div class="strip" role="list" aria-label="칸별 이동 설비">${cells}</div>`;
}

function renderList() {
  const shown = items.filter(i => facility === "전체" || i.plfmCmgFac === facility);
  const stns = new Map();
  for (const i of shown) {
    const sk = `${i.stnNm}|${i.lineNm}`, dk = `${i.upbdnbSe}|${i.drtnInfo}`;
    if (!stns.has(sk)) stns.set(sk, new Map());
    if (!stns.get(sk).has(dk)) stns.get(sk).set(dk, []);
    stns.get(sk).get(dk).push(i);
  }
  const num = d => (d || "").split("-").map(n => String(n).padStart(3, "0")).join("-");
  body.className = "";
  const head = `<div class="sum"><b>${esc(lastName)}</b><span>${facility === "전체" ? "" : esc(facility) + " "}${shown.length}곳</span></div>
    <p class="guide">표시된 칸에서 내리면 그 설비가 가장 가까워요. 칸 번호는 열차 앞쪽부터 센 값이에요.</p>`;
  body.innerHTML = head + ([...stns.keys()].sort().map(sk => {
    const dirs = stns.get(sk), first = dirs.values().next().value[0];
    return `<div class="stnbox"><h3 class="stn">${esc(first.stnNm)} ${lineBadge(first.lineNm)}</h3>` +
      [...dirs.keys()].sort().map(dk => {
        const rows = dirs.get(dk).sort((a, b) => num(a.qckgffVhclDoorNo).localeCompare(num(b.qckgffVhclDoorNo)));
        const f = rows[0];
        return `<div class="group"><h4 class="dir">${esc(f.drtnInfo)} 방면<small>${esc(f.upbdnbSe)}</small></h4>${strip(rows)}` +
          rows.map(r => {
            const [car, door] = (r.qckgffVhclDoorNo || "").split("-");
            return `<div class="row"><div class="door"><b>${esc(r.qckgffVhclDoorNo)}</b><span>${esc(car)}번 칸 ${esc(door)}번 문</span></div>
              <div class="info"><b>${FAC_ICON[r.plfmCmgFac] || ""} ${esc(r.plfmCmgFac)}</b>${r.fwkPstnNm ? `<div>${esc(r.fwkPstnNm)}</div>` : ""}</div></div>`;
          }).join("") + "</div>";
      }).join("") + "</div>";
  }).join("") || '<div class="empty">고른 설비에 해당하는 문이 없어요. 다른 설비를 골라 보세요.</div>');
  const ymd = items[0] && items[0].crtrYmd;
  if (ymd) body.insertAdjacentHTML("beforeend", `<div class="meta">기준 날짜: ${ymd.slice(0,4)}-${ymd.slice(4,6)}-${ymd.slice(6,8)}</div>`);
}

async function search(name) {
  name = name.trim();
  if (!name) { document.getElementById("q").focus(); return; }
  const url = API.exit + "?stnNm=" + encodeURIComponent(name);
  document.getElementById("apiUrl").textContent = url;
  document.getElementById("apiLink").href = url;
  lastName = name;
  const card = document.getElementById("resultCard");
  card.hidden = false;
  card.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); // 결과가 화면 밖에 있어도 바로 보이게
  document.getElementById("facFilter").innerHTML = "";
  body.className = "loading";
  body.textContent = "불러오는 중이에요…";
  try {
    const res = await fetch(url); // 🔌 API 호출
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(data.error || "HTTP " + res.status);
      if (res.status === 400 || res.status === 429) err.friendly = true;
      throw err;
    }
    items = data.items;
    facility = "전체";
    if (!items.length) {
      body.className = "empty";
      body.textContent = `"${name}"에 해당하는 역을 못 찾았어요. 역 이름만 입력해 보세요. (예: 강남)`;
      return;
    }
    renderFilter();
    renderList();
  } catch (e) {
    body.className = "error";
    body.textContent = e.friendly ? "⚠️ " + e.message : "⚠️ 불러오지 못했어요. 잠시 뒤 다시 시도해 주세요." + whyFailed(e);
  }
}

document.getElementById("form").onsubmit = e => { e.preventDefault(); search(document.getElementById("q").value); };
document.getElementById("quick").innerHTML = QUICK.map(n => `<button type="button" class="chip" aria-label="${esc(n)} 찾기">${esc(n)}</button>`).join("");
document.getElementById("quick").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  document.getElementById("q").value = b.textContent; search(b.textContent);
};
document.getElementById("facFilter").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  facility = b.dataset.k; renderFilter(); renderList();
};
document.getElementById("apiUrl").textContent = API.exit + "?stnNm=역이름";

// 라이트/다크 토글: 고른 값은 기억해 두고, 없으면 기기 설정을 따른다
(function () {
  const root = document.documentElement, btn = document.getElementById("theme");
  const isDark = () => root.dataset.theme
    ? root.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  function paint() {
    btn.setAttribute("aria-checked", isDark());
  }
  try { const s = localStorage.getItem("theme"); if (s) root.dataset.theme = s; } catch (e) {}
  btn.onclick = () => {
    root.dataset.theme = isDark() ? "light" : "dark";
    try { localStorage.setItem("theme", root.dataset.theme); } catch (e) {}
    paint();
  };
  paint();
})();
</script>
</body>
</html>
